services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fees
      POSTGRES_PASSWORD: fees
      POSTGRES_DB: fees
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-postgres://fees:fees@db:5432/fees}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      # cron-job.org REST API key for the monthly reminder cron
      CRONJOB_API_KEY: ${CRONJOB_API_KEY:-}
      # YOUPI PG runs on the host in the default local setup.
      YOUPI_PAYMENT_API_URL: ${YOUPI_PAYMENT_API_URL:-http://host.docker.internal:6100}
      # Public checkout portal origin (for example https://pay.myenum.in).
      YOUPI_PUBLIC_CHECKOUT_URL: ${YOUPI_PUBLIC_CHECKOUT_URL:-}
      YOUPI_WEBHOOK_SECRET: ${YOUPI_WEBHOOK_SECRET:-}
      YOUPI_ADMIN_TOKEN: ${YOUPI_ADMIN_TOKEN:-}
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  pgdata:
