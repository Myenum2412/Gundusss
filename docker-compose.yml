services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:3000
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-https://fra.cloud.appwrite.io/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-6ae5c669000e75f3ad50}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:?Set APPWRITE_API_KEY before starting Compose}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-fees}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      # cron-job.org REST API key for the monthly reminder cron
      CRONJOB_API_KEY: ${CRONJOB_API_KEY:?Set CRONJOB_API_KEY before starting Compose}
      # YOUPI PG runs on the host in the default local setup.
      YOUPI_PAYMENT_API_URL: ${YOUPI_PAYMENT_API_URL:-http://host.docker.internal:6100}
      # Public checkout portal origin (for example https://pay.myenum.in).
      YOUPI_PUBLIC_CHECKOUT_URL: ${YOUPI_PUBLIC_CHECKOUT_URL:-}
      YOUPI_WEBHOOK_SECRET: ${YOUPI_WEBHOOK_SECRET:-}
      YOUPI_ADMIN_TOKEN: ${YOUPI_ADMIN_TOKEN:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
